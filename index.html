<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEPE ON BAG</title>
  <meta name="description" content="Halloween costume. On-chain trick. No eye holes." />
  <meta property="og:title" content="PEPE ON BAG" />
  <meta property="og:description" content="Wear the bag. Buy the bag. Don't look through it." />
  <meta property="og:image" content="pepe-bag.jpg" />
  <meta name="theme-color" content="#140c08" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>" />
  <style>
    :root {
      --night: #120b07;
      --night-2: #1c100a;
      --bone: #f2dfc0;
      --kraft: #c49255;
      --pumpkin: #ff6b1a;
      --pumpkin-dim: #c44a0d;
      --ink: #1a120c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      background:
        radial-gradient(900px 520px at 50% -8%, rgba(255, 107, 26, 0.18), transparent 58%),
        radial-gradient(700px 400px at 110% 110%, rgba(196, 74, 13, 0.16), transparent 50%),
        var(--night);
      color: var(--bone);
      font-family: "Libre Baskerville", Georgia, serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.09;
      background-image:
        radial-gradient(circle at 20% 30%, #fff 0.6px, transparent 0.7px),
        radial-gradient(circle at 80% 70%, #fff 0.5px, transparent 0.6px);
      background-size: 18px 18px, 22px 22px;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 16px 56px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--kraft);
    }

    .tg {
      color: var(--pumpkin);
      text-decoration: none;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--pumpkin);
    }

    .hero {
      width: min(92vw, 520px);
      aspect-ratio: 1 / 1;
      margin: 10px 0 18px;
      position: relative;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 16%;
      display: block;
      border: 2px solid #6b3d16;
      box-shadow:
        0 0 0 1px rgba(255, 107, 26, 0.25),
        0 24px 50px rgba(0, 0, 0, 0.45),
        0 0 40px rgba(255, 107, 26, 0.12);
    }

    .badge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: var(--night);
      color: var(--pumpkin);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 6px 8px;
      border: 1px solid var(--pumpkin-dim);
    }

    h1 {
      font-family: "Creepster", cursive;
      font-size: clamp(42px, 13vw, 84px);
      line-height: 0.86;
      text-align: center;
      color: var(--pumpkin);
      text-shadow: 0 3px 0 #4a1c05, 0 10px 24px rgba(0, 0, 0, 0.45);
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    .sub {
      margin-top: 12px;
      text-align: center;
      font-size: 15px;
      font-style: italic;
      color: var(--bone);
      max-width: 22em;
      line-height: 1.45;
    }

    .hint {
      margin-top: 8px;
      text-align: center;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--kraft);
      max-width: 34em;
      line-height: 1.6;
    }

    .ca-box {
      margin-top: 26px;
      width: 100%;
      max-width: 520px;
      background: rgba(28, 16, 10, 0.72);
      border: 1px solid #6b3d16;
      padding: 14px;
    }

    .ca-label {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--pumpkin);
      margin-bottom: 8px;
    }

    .ca-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #ca {
      flex: 1;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      word-break: break-all;
      line-height: 1.45;
      color: var(--bone);
    }

    button.copy {
      appearance: none;
      border: 1px solid var(--pumpkin);
      background: var(--pumpkin);
      color: var(--night);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }

    button.copy:hover { filter: brightness(1.08); }
    button.copy.ok {
      background: transparent;
      color: var(--pumpkin);
    }

    .links {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 520px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: var(--night);
      background: var(--pumpkin);
      padding: 12px 14px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
      flex: 1 1 140px;
      text-align: center;
    }

    .btn.ghost {
      background: transparent;
      color: var(--bone);
      border: 1px solid #6b3d16;
    }

    footer {
      margin-top: auto;
      padding-top: 36px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #7a5a38;
      text-align: center;
    }

    @media (max-width: 520px) {
      .hero { width: 100%; }
      .ca-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Oct 31 · on-chain</div>
      <a class="tg" href="https://t.me/pepeonbag" target="_blank" rel="noopener">telegram</a>
    </header>

    <div class="hero">
      <img src="pepe-bag.jpg" alt="Halloween paper bag with Sharpie Pepe" />
      <div class="badge">no eye holes</div>
    </div>

    <h1>PEPE<br>ON BAG</h1>
    <p class="sub">The costume is a paper bag. The trick is the coin.</p>
    <p class="hint">Wear it on Halloween. Hold it after.</p>

    <div class="ca-box">
      <div class="ca-label">Contract</div>
      <div class="ca-row">
        <div id="ca">loading…</div>
        <button class="copy" type="button" id="copy">copy</button>
      </div>
    </div>

    <div class="links">
      <a class="btn" href="https://t.me/pepeonbag" target="_blank" rel="noopener">Telegram</a>
      <a class="btn ghost" id="pump" href="#" target="_blank" rel="noopener">Pump</a>
      <a class="btn ghost" id="dex" href="#" target="_blank" rel="noopener">Dex</a>
    </div>

    <footer>not financial advice · just a bag with a face on it</footer>
  </div>

  <script>
    const caEl = document.getElementById("ca");
    const copyBtn = document.getElementById("copy");
    const pumpLink = document.getElementById("pump");
    const dexLink = document.getElementById("dex");
    let currentCa = "";

    function firstAddress(text) {
      const lines = String(text || "").split(/\r?\n/);
      for (const raw of lines) {
        const line = raw.trim();
        if (!line || line.startsWith("#")) continue;
        return line;
      }
      return "";
    }

    function setCa(value) {
      currentCa = (value || "").trim();
      caEl.textContent = currentCa || "drop the address in ca.txt";
      if (currentCa && currentCa !== "TBA") {
        pumpLink.href = "https://pump.fun/coin/" + currentCa;
        dexLink.href = "https://dexscreener.com/solana/" + currentCa;
      }
    }

    fetch("ca.txt", { cache: "no-store" })
      .then((res) => {
        if (!res.ok) throw new Error("missing ca.txt");
        return res.text();
      })
      .then((text) => setCa(firstAddress(text)))
      .catch(() => setCa("TBA"));

    copyBtn.addEventListener("click", async () => {
      if (!currentCa || currentCa === "TBA") return;
      try {
        await navigator.clipboard.writeText(currentCa);
      } catch {
        const range = document.createRange();
        range.selectNodeContents(caEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand("copy");
        sel.removeAllRanges();
      }
      copyBtn.textContent = "copied";
      copyBtn.classList.add("ok");
      setTimeout(() => {
        copyBtn.textContent = "copy";
        copyBtn.classList.remove("ok");
      }, 1400);
    });
  </script>
</body>
</html>
